[project]
name = "lims-hongqiao-backend"
version = "0.1.0"
description = "Hongqiao Lab LIMS backend (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in argument defaults
