spring:
  datasource:
    url: jdbc:h2:mem:lims;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

lims:
  jwt:
    secret: test-secret-key-please-change-in-production-environment
    expire-minutes: 60
  security:
    login-rate-limit-per-minute: 0
    max-failed-attempts: 5
    lockout-minutes: 15
