spring:
  application:
    name: hongqiao-lims
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lims}
    username: ${SPRING_DATASOURCE_USERNAME:lims}
    password: ${SPRING_DATASOURCE_PASSWORD:lims}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8000

springdoc:
  swagger-ui:
    path: /api/docs

lims:
  api-prefix: /api/v1
  jwt:
    secret: ${SECRET_KEY:change-me-in-production-please-use-a-long-random-string}
    expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:1440}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    password-min-length: ${PASSWORD_MIN_LENGTH:8}
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:60}
    enforce-strong-secret: ${ENFORCE_STRONG_SECRET:false}
  admin:
    username: ${FIRST_ADMIN_USERNAME:admin}
    password: ${FIRST_ADMIN_PASSWORD:admin123}
    name: ${FIRST_ADMIN_NAME:系统管理员}
